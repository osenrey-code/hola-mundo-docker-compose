services:
  app:
    build:
      context: ./src
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: hola_mundo
      DB_USER: app_user
      DB_PASSWORD: app_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hola_mundo
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp_user", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
